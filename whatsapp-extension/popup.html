<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Web Media Extractor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        .icon-box {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .title { font-size: 15px; font-weight: 700; color: #ffffff; }
        .subtitle { font-size: 11px; color: #94a3b8; }
        .status-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #4ade80;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }
        .btn-scan {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-scan:hover { opacity: 0.9; }
        .guide {
            margin-top: 16px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .guide ol { padding-left: 16px; }
        .guide li { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="icon-box">📥</div>
        <div>
            <div class="title">WA Media Extractor</div>
            <div class="subtitle">WhatsApp Web Blob Downloader</div>
        </div>
    </div>

    <div class="status-card">
        <div class="status-indicator">
            <span class="dot"></span>
            <span id="status-text">Active on WhatsApp Web</span>
        </div>
    </div>

    <button id="scan-btn" class="btn-scan">Scan Current Chat Media</button>

    <div class="guide">
        <strong>How to use:</strong>
        <ol>
            <li>Open <a href="https://web.whatsapp.com" target="_blank" style="color:#38bdf8;">web.whatsapp.com</a></li>
            <li>Select any chat conversation</li>
            <li>Click <strong>"Download All Media"</strong> in the chat header or click the button above!</li>
        </ol>
    </div>

    <script src="popup.js"></script>
</body>
</html>
