services:
  - type: web
    name: social-media-downloader-api
    env: python
    region: oregon
    buildCommand: mkdir -p node_bin && curl -sL https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz | tar -xJ --strip-components=1 -C node_bin && pip install -r requirements.txt
    startCommand: export PATH=$PYTHONPATH:$(pwd)/node_bin/bin:$PATH && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

